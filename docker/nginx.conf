# Language for the root redirect: Spanish when the browser asks for it,
# English otherwise. Googlebot sends no Accept-Language and lands on /en/.
map $http_accept_language $docs_lang {
    default en;
    ~*^es   es;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The site is exported with trailing slashes, so every page is an
    # index.html inside its own directory.
    # The root belongs to no language: a real HTTP redirect, so a crawler
    # never sees an empty page that only redirects in JavaScript.
    location = / {
        add_header Vary Accept-Language;
        return 302 /$docs_lang/;
    }

    # Old links without a language segment.
    location /docs/ {
        return 301 /en$request_uri;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and fonts: long, but revalidated.
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML is cheap to re-fetch and must reflect a redeploy immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
